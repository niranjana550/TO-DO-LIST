<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do-List</title>
    <link rel="icon"  href="image/todo icon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="start-container">
            <div class="info">
                <h1>TO DO PAGE</h1>
                <p>KEEP MOVING!</p>
                <div id="progressbar">
                <div id="progress"></div>
            </div>
            </div>
             
            <div class="bar-number">
              <p id="number">0/0</p>
            </div>
            
           </div>
  
            <form class="action"> 
                <input id="taskinput" type="text" placeholder="write your task">
            <button id="newtask" type="submit">+</button></form>
           
            <ul id="tasklist"></ul>
  <script src="script.js"></script>  
  <script
            src="https://cdn.jsdelivr.net/npm/@tsparticles/confetti@4.4.0/tsparticles.confetti.bundle.min.js"></script>
          
</body>
</html>
